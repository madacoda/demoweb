limit_req_zone $binary_remote_addr zone=demoweb_requests:10m rate=20r/s;
log_format demoweb_redacted '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name demoweb.madacoda.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/demoweb-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://demoweb.madacoda.dev$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demoweb.madacoda.dev;
    ssl_certificate /etc/letsencrypt/live/demoweb.madacoda.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demoweb.madacoda.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:demoweb_tls:10m;
    client_max_body_size 32k;
    server_tokens off;
    access_log /var/log/nginx/demoweb.access.log demoweb_redacted;
    error_log /var/log/nginx/demoweb.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        limit_req zone=demoweb_requests burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:1112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
