# Temporary HTTP virtual host for initial certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name demoweb.madacoda.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/demoweb-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
