name: demoweb
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo_district}
      POSTGRES_DB: ${POSTGRES_DB:-demo_district}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.deploy first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
  web:
    image: ${DEMOWEB_IMAGE:?Set the GHCR image tag or digest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Generate .env.deploy first}
      DEMO_NAMESPACE: ${DEMO_NAMESPACE:-default}
      HOSTNAME: 0.0.0.0
      PORT: "1112"
    ports:
      - "${DEMOWEB_BIND_ADDRESS:-127.0.0.1}:${DEMOWEB_PORT:-1112}:1112"
    depends_on:
      db:
        condition: service_healthy
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
volumes:
  postgres_data:
